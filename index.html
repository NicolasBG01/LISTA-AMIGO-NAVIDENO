<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amigo secreto: lista de regalos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Limelight&display=swap" rel="stylesheet">
<style>
:root {
  --bg-cream: #f4efe6;
  --card-bg: rgba(247, 241, 231, 0.94);
  --panel-bg: #faf4ea;
  --input-bg: #fdfaf5;
  --ink: #1b261d;
  --muted: #5c665e;
  --line: #cbbca8;
  --pine: #1b3b2b;
  --pine-hover: #12291e;
  --pine-ink: #ffffff;
  --red: #8c1d24;
  --red-hover: #6a1319;
  --red-ink: #ffffff;
  --soft-bg: #ebdcc9;
  box-sizing: border-box;
}

*, *::before, *::after { box-sizing: inherit; }

body {
  margin: 0;
  background-color: var(--bg-cream);
  background-image: url('fondo.jpg');
  background-repeat: repeat;
  background-size: 320px auto;
  background-attachment: fixed;
  color: var(--ink);
  font-family: "Happy Monkey", system-ui, sans-serif;
  font-size: 1.1rem;
  line-height: 1.5;
}

main {
  max-width: 880px;
  margin: 3rem auto;
  padding: 2.5rem 2rem 3.5rem;
  background: var(--card-bg);
  border-radius: 18px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
  border: 1px solid var(--line);
}

/* ENCABEZADOS DE SECCIÓN EN LIMELIGHT */
h1 {
  font-family: "Limelight", cursive, sans-serif;
  font-size: 2.5rem;
  font-weight: 400;
  line-height: 1.25;
  margin: 0 0 0.5rem;
  color: var(--red);
  text-align: center;
  letter-spacing: 1px;
}

h2 {
  font-family: "Limelight", cursive, sans-serif;
  font-size: 1.6rem;
  font-weight: 400;
  margin: 0 0 0.8rem;
  color: var(--pine);
  letter-spacing: 0.5px;
}

.intro {
  color: var(--muted);
  margin: 0 auto 2rem;
  max-width: 34em;
  text-align: center;
  font-size: 1.1rem;
  font-family: "Happy Monkey", sans-serif;
}

.panel {
  background: var(--panel-bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1.75rem;
  box-shadow: 0 4px 16px rgba(0,0,0,0.04);
}

label, .lbl {
  display: block;
  font-family: "Happy Monkey", system-ui, sans-serif;
  font-size: 1.15rem;
  font-weight: 700;
  margin: 1.2rem 0 0.3rem;
  color: var(--pine);
}

.hint {
  color: var(--muted);
  font-size: 0.95rem;
  font-weight: 400;
}

input[type=text], textarea {
  width: 100%;
  font-family: "Happy Monkey", sans-serif;
  font-size: 1.05rem;
  color: var(--ink);
  background: var(--input-bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0.7rem 0.9rem;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input[type=text]:focus, textarea:focus {
  outline: none;
  border-color: var(--pine);
  box-shadow: 0 0 0 3px rgba(27, 59, 43, 0.15);
}

textarea {
  min-height: 4.5rem;
  resize: vertical;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: "Happy Monkey", sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  min-height: 3.2rem;
  padding: 0.5rem 1.5rem;
  border-radius: 8px;
  border: 1px solid var(--pine);
  background: var(--pine);
  color: var(--pine-ink);
  cursor: pointer;
  transition: background-color 0.2s, border-color 0.2s;
}

.btn:hover {
  background: var(--pine-hover);
  border-color: var(--pine-hover);
}

.btn.alt {
  background: transparent;
  color: var(--pine);
  border: 1px solid var(--pine);
}

.btn.alt:hover {
  background: rgba(27, 59, 43, 0.08);
}

.btn.del {
  background: transparent;
  border-color: #c9888c;
  color: var(--red);
}

.btn.del:hover {
  background: #f7e6e7;
}

.btn.del.sure {
  background: var(--red);
  color: var(--red-ink);
  border-color: var(--red);
}

input[type=file] { position: absolute; opacity: 0; width: 1px; height: 1px; }

#preview {
  display: none;
  width: 100%;
  max-height: 280px;
  object-fit: contain;
  background: var(--soft-bg);
  border-radius: 8px;
  margin-top: 1rem;
  border: 1px solid var(--line);
}

#msg {
  min-height: 1.5em;
  margin: 1rem 0 0;
  font-size: 1rem;
  font-family: "Happy Monkey", sans-serif;
}
#msg.err { color: var(--red); }
#msg.ok { color: var(--pine); }

.list-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.5rem;
  margin: 2.5rem 0 1.25rem;
  border-bottom: 1px solid var(--line);
  padding-bottom: 0.75rem;
}

.list-head h2 { margin: 0; }

details.person {
  background: var(--panel-bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 1rem;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

summary.name-row {
  padding: 1rem 1.4rem;
  font-family: "Limelight", cursive, sans-serif;
  font-size: 1.35rem;
  color: var(--pine);
  cursor: pointer;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--panel-bg);
  transition: background-color 0.2s;
}

summary.name-row:hover {
  background: #f2e6d6;
}

summary.name-row::-webkit-details-marker { display: none; }
summary.name-row::after {
  content: "▼";
  font-family: "Happy Monkey", sans-serif;
  font-size: 0.85rem;
  color: var(--red);
  transition: transform 0.2s ease;
}

details[open] summary.name-row::after {
  transform: rotate(180deg);
}

details[open] summary.name-row {
  border-bottom: 1px solid var(--line);
  background: #f2e6d6;
}

.person-gifts {
  padding: 1.25rem;
  background: #f5ece0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 1.25rem;
}

.gift {
  background: var(--input-bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.gift img {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: contain;
  padding: 0.6rem;
  background: #ffffff;
  border-bottom: 1px solid var(--line);
}

.noimg {
  aspect-ratio: 3/4;
  display: grid;
  place-items: center;
  background: var(--soft-bg);
  color: var(--muted);
  font-size: 1rem;
  border-bottom: 1px solid var(--line);
}

.gift .body {
  padding: 1rem 1.1rem;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  flex: 1;
}

/* NOMBRE DEL REGALO CON HAPPY MONKEY Y AJUSTE DE LÍNEA FLUIDO */
.gift h3 {
  margin: 0;
  font-family: "Happy Monkey", sans-serif;
  font-size: 1.2rem;
  font-weight: 700;
  line-height: 1.4;
  color: var(--red);
  overflow-wrap: break-word;
  word-break: break-word;
  white-space: pre-wrap;
}

.note {
  margin: 0.2rem 0 0.5rem;
  color: var(--muted);
  font-family: "Happy Monkey", sans-serif;
  font-size: 1rem;
  line-height: 1.5;
  overflow-wrap: break-word;
  word-break: break-word;
  white-space: pre-wrap;
}

.gift .btn {
  margin-top: auto;
  align-self: flex-start;
  padding: 0.4rem 1rem;
  min-height: 2.2rem;
  font-size: 0.95rem;
}

.empty {
  border: 1px dashed var(--line);
  border-radius: 10px;
  padding: 2.5rem 1.5rem;
  text-align: center;
  color: var(--muted);
  background: var(--panel-bg);
  font-size: 1.1rem;
  font-family: "Happy Monkey", sans-serif;
}

.notice {
  border: 1px solid var(--red);
  background: #f7e6e7;
  border-radius: 8px;
  padding: 1rem 1.2rem;
  margin: 1rem 0;
  color: var(--red);
  font-size: 1rem;
  font-family: "Happy Monkey", sans-serif;
}

.top {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  align-items: center;
  margin: 0 0 1.5rem;
}

.top .btn {
  flex: 1 1 260px;
  font-family: "Limelight", cursive, sans-serif;
  font-size: 1.25rem;
  min-height: 3.6rem;
  background: var(--red);
  border-color: var(--red);
}

.top .btn:hover {
  background: var(--red-hover);
  border-color: var(--red-hover);
}

[hidden] { display: none !important; }

.sub {
  display: flex;
  gap: 0.75rem;
  margin-top: 1.5rem;
}

.sub .btn { flex: 1; }

@media (max-width: 600px) {
  main {
    margin: 0;
    border-radius: 0;
    border: none;
    padding: 2rem 1rem 3rem;
  }
  h1 { font-size: 1.9rem; }
  h2 { font-size: 1.35rem; }
  summary.name-row { font-size: 1.15rem; padding: 0.9rem; }
  body { font-size: 1rem; }
}
</style>
</head>
<body>
<main>
  <h1>Regalos del Amigo Secreto</h1>
  <p class="intro">Toca el botón principal para agregar tus opciones de regalo. Cada participante puede desplegar su nombre para ver las opciones registradas.</p>
  <div id="aviso" class="notice" hidden></div>

  <div class="top">
    <button class="btn" id="abrir" type="button">Agregar mi opcion de regalo</button>
  </div>

  <section class="panel" id="form" aria-labelledby="t-nuevo" hidden>
    <h2 id="t-nuevo">Agregar opcion de regalo</h2>

    <label for="nombre">Tu nombre</label>
    <input type="text" id="nombre" autocomplete="given-name" placeholder="Escribe tu nombre completo">

    <label for="regalo">¿Qué regalo te gustaría?</label>
    <textarea id="regalo" placeholder="Por ejemplo: Un libro, saco talla M, etc."></textarea>

    <label for="detalle">Detalles <span class="hint">(color, talla, tienda u enlace opcional)</span></label>
    <textarea id="detalle"></textarea>

    <span class="lbl">Foto del regalo <span class="hint">(opcional)</span></span>
    <label class="btn alt" id="pick" for="foto" style="margin:0">Tomar o elegir foto</label>
    <input type="file" id="foto" accept="image/*">
    <img id="preview" alt="Vista previa de la foto elegida">

    <div class="sub">
      <button class="btn" id="guardar" type="button">Guardar regalo</button>
      <button class="btn alt" id="cancelar" type="button">Cancelar</button>
    </div>
    <p id="msg" role="status" aria-live="polite"></p>
  </section>

  <div class="list-head">
    <h2>Lista por participante</h2>
    <span id="count" class="hint"></span>
  </div>
  <div id="lista"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB0EazZiJISCsNBZk10XBwk2GxEH5hnQMY",
  authDomain: "lista-amigo-secreto.firebaseapp.com",
  projectId: "lista-amigo-secreto",
  storageBucket: "lista-amigo-secreto.firebasestorage.app",
  messagingSenderId: "690611971137",
  appId: "1:690611971137:web:823f17f330de37b24a52c0",
  measurementId: "G-ZJV3L4PCL7"
};

var photo = "", myId = "", gifts = [], busy = false, db = null, auth = null;
var $ = function(id){ return document.getElementById(id); };
function el(tag, cls, text){ var n = document.createElement(tag); if(cls) n.className = cls; if(text) n.textContent = text; return n; }
function say(text, kind){ var m = $("msg"); m.textContent = text; m.className = kind || ""; }
function aviso(text){ var a = $("aviso"); a.textContent = text || ""; a.hidden = !text; }

function resize(file, cb){
  var reader = new FileReader();
  reader.onerror = function(){ cb(""); };
  reader.onload = function(){
    var img = new Image();
    img.onerror = function(){ cb(""); };
    img.onload = function(){
      var max = 700, s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL("image/jpeg", 0.7));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

$("abrir").addEventListener("click", function(){
  $("form").hidden = false; $("abrir").hidden = true;
  $("form").scrollIntoView({behavior:"smooth", block:"start"});
  $("nombre").focus({preventScroll:true});
});
function cerrar(){
  $("form").hidden = true; $("abrir").hidden = false;
  $("regalo").value = ""; $("detalle").value = ""; $("foto").value = "";
  photo = ""; $("preview").style.display = "none"; $("pick").textContent = "Tomar o elegir foto"; say("");
}
$("cancelar").addEventListener("click", cerrar);

$("foto").addEventListener("change", function(e){
  var f = e.target.files && e.target.files[0];
  if(!f) return;
  say("Cargando la foto…");
  resize(f, function(data){
    var p = $("preview");
    if(!data){ photo = ""; p.style.display = "none"; say("Error al leer la foto. Intenta otra.", "err"); return; }
    photo = data; p.src = data; p.style.display = "block";
    $("pick").textContent = "Cambiar la foto";
    say("Foto lista.", "ok");
  });
});

$("guardar").addEventListener("click", async function(){
  if(!db){ say("Error de base de datos.", "err"); return; }
  var nombre = $("nombre").value.trim(), regalo = $("regalo").value.trim();
  if(!nombre){ say("Escribe tu nombre.", "err"); $("nombre").focus(); return; }
  if(!regalo){ say("Escribe la opción de regalo.", "err"); $("regalo").focus(); return; }
  if(!myId){ say("Espera un momento e intenta de nuevo.", "err"); return; }
  if(busy) return;
  busy = true; $("guardar").disabled = true; say("Guardando…");
  try {
    await addDoc(collection(db, "gifts"), { nombre: nombre.slice(0,60), regalo: regalo.slice(0,300), detalle: $("detalle").value.trim().slice(0,600), foto: photo, owner: myId, ts: Date.now() });
    cerrar(); say("¡Opción guardada!", "ok");
  } catch(e){
    say("Error al guardar. Revisa tu conexión.", "err");
  }
  busy = false; $("guardar").disabled = false;
});

function render(){
  var box = $("lista"); box.textContent = "";
  
  if(!gifts.length){
    $("count").textContent = "0 participantes";
    var e = el("div", "empty", "Aún no hay regalos registrados. Agrega el tuyo en el botón superior.");
    box.appendChild(e); return;
  }

  var grupos = {};
  gifts.forEach(function(g){
    var nombreReal = (g.data.nombre || "Sin nombre").trim();
    var llave = nombreReal.toLowerCase(); 
    if(!grupos[llave]) grupos[llave] = { nombre: nombreReal, regalos: [] };
    grupos[llave].regalos.push(g);
  });

  var cantPersonas = Object.keys(grupos).length;
  $("count").textContent = cantPersonas + (cantPersonas === 1 ? " participante" : " participantes");

  Object.values(grupos).forEach(function(persona){
    var details = el("details", "person");
    var summary = el("summary", "name-row", persona.nombre + " (" + persona.regalos.length + " opciones)");
    details.appendChild(summary);

    var giftsContainer = el("div", "person-gifts");
    var grid = el("div", "grid");

    persona.regalos.forEach(function(g){
      var d = g.data, card = el("article", "gift");
      if(d.foto){ var im = document.createElement("img"); im.src = d.foto; im.alt = "Foto del regalo"; card.appendChild(im); }
      else card.appendChild(el("div", "noimg", "Sin foto"));
      
      var body = el("div", "body");
      body.appendChild(el("h3", "", d.regalo || ""));
      if(d.detalle) body.appendChild(el("p", "note", d.detalle));
      
      if(myId && d.owner === myId){
        var b = el("button", "btn del", "Quitar"), t; b.type = "button";
        b.addEventListener("click", function(){
          if(!b.classList.contains("sure")){
            b.classList.add("sure"); b.textContent = "Confirmar eliminación";
            t = setTimeout(function(){ b.classList.remove("sure"); b.textContent = "Quitar"; }, 4000);
            return;
          }
          clearTimeout(t);
          deleteDoc(doc(db, "gifts", g.id)).catch(function(){ aviso("No se pudo eliminar."); });
        });
        body.appendChild(b);
      }
      card.appendChild(body); grid.appendChild(card);
    });

    giftsContainer.appendChild(grid);
    details.appendChild(giftsContainer);
    box.appendChild(details);
  });
}

try {
  var app = initializeApp(firebaseConfig);
  db = getFirestore(app); auth = getAuth(app);
  onAuthStateChanged(auth, function(u){ if(u) myId = u.uid; render(); });
  signInAnonymously(auth).catch(function(){ aviso("Error de autenticación."); });
  onSnapshot(query(collection(db, "gifts"), orderBy("ts", "desc"), limit(300)), function(snap){
    gifts = snap.docs.map(function(x){ return { id: x.id, data: x.data() }; });
    render();
  }, function(){ aviso("No se pudieron cargar los datos."); });
} catch(e){ aviso("Error al conectar con Firebase."); }
</script>
</body>
</html>
